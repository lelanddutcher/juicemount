# JuiceMount metadata Redis — optional ops-hardening config.
#
# The compose template runs redis with command-line args (zero-setup, correct
# defaults incl. keyspace notifications). For a production NAS, prefer THIS
# file instead: copy it into your redis data dir (the /data volume) and change
# the compose command to:  ["redis-server", "/data/redis.conf"]
# Benefits: `CONFIG REWRITE` persists runtime changes (impossible with args),
# and all settings live in one versionable place — no config drift between
# what's "configured" and what the container actually runs.
dir /data
appendonly yes
appendfsync everysec
maxmemory-policy noeviction
save 900 1
# Keyspace notifications power the Mac client's instant metadata push;
# without them the client falls back to a permanent 30s full SCAN.
notify-keyspace-events KEA
