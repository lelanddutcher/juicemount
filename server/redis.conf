# JuiceMount metadata Redis configuration.
#
# Loaded by the canonical compose (server/docker-compose.yml) as
#   redis-server /usr/local/etc/redis/redis.conf --aclfile /run/jm-redis/users.acl
# The users file is rendered at container start from server/redis.acl.
# Do NOT add `user` or `requirepass` lines here: Redis refuses users defined
# in both redis.conf and an ACL file, and every login is an ACL user.
#
# The file is mounted read-only, so `CONFIG REWRITE` fails by design: change
# settings here and recreate the container through the rollout script.

# Reachable on the compose network only. The service publishes no host port;
# clients go through respproxy (host port 30179). `user default off` in the
# ACL means every connection must authenticate, so protected mode (which only
# guards a passwordless default user) is redundant and stays off.
bind 0.0.0.0
port 6379
protected-mode no

dir /data
appendonly yes
appendfsync everysec
maxmemory-policy noeviction
save 900 1

# Keyspace notifications power the Mac client's instant metadata push
# (PSUBSCRIBE __keyspace@1__:d*); without them the client falls back to a
# periodic full SCAN. Clients cannot CONFIG SET this through the proxy (admin
# only), so it must be set here.
notify-keyspace-events KEA
