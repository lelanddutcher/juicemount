name: remote-lab

# The remote lab (test/remote-lab): the server stack and a JuiceFS client
# behind an emulated WAN, all in private Docker networks. This job runs a
# reduced matrix (lan and abroad, small fixture) and uploads the JSON. It
# fails only when the lab breaks (a link check, a mount or a probe fails),
# never on the numbers.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'third_party/juicefs/**'
      - 'cmd/jm-respproxy/**'
      - 'internal/respproxy/**'
      - 'server/respproxy/**'
      - 'server/redis.conf'
      - 'server/redis.acl'
      - 'server/docker-compose.yml'
      - 'internal/netprofile/**'
      - 'go.mod'
      - 'go.sum'
      - 'test/remote-lab/**'
      - '.github/workflows/remote-lab.yml'

permissions:
  contents: read

concurrency:
  group: remote-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Traffic shaping is available
        # tc in the wan container needs the netem and htb qdiscs. The runner
        # kernel normally loads them on first use; load them up front so a
        # missing module fails here, with a clear message.
        run: |
          sudo modprobe sch_netem && sudo modprobe sch_htb || {
            sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe sch_netem && sudo modprobe sch_htb; }
          test -c /dev/fuse
      - name: Run lan and abroad
        working-directory: test/remote-lab
        run: |
          ./measure.py --profiles lan,abroad --fixture small \
            --open-count 10 --seq-budget 15 --scrub-budget 20 \
            --write-files 10 --write-kib 64 --write-budget 20
      - name: Scoreboard
        if: always()
        working-directory: test/remote-lab
        run: |
          for f in results/*/scoreboard.md; do [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"; done
          for f in results/*/run.json; do [ -f "$f" ] && cat "$f"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: remote-lab-results
          path: test/remote-lab/results/
          if-no-files-found: warn
      - name: Tear down
        if: always()
        working-directory: test/remote-lab
        run: ./lab.sh down || true
