name: storage-published-binary-security
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binary-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Inspect published storage binaries without executing them
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 40208c76fd7175987f307b972cef156d785b4163
          python3 - <<'PYTHON'
          import subprocess
          assert set(subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines())=={'.github/workflows/ci.yml','server/minio/qualify-binary-security.py'}
          PYTHON
          python3 server/minio/qualify-binary-security.py
      - name: Upload original security scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-binary-security-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/jm-storage-security-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*
