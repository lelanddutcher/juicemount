name: minio-source-real-iam

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-real-iam:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CANDIDATE: 4dc11fed3533de754a2e04fce3307985774789d2
      MINIO_SOURCE: 827004cd6d3da8f49a5320c94ae74ae128156ed6
      MC_SOURCE: cc8758c88da31b95dde7b0b6997980ebfb8b98c4
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bind unchanged production source and create private cloud workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$CANDIDATE"
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines())
          assert changed=={'.github/workflows/ci.yml','server/minio/qualify-real-iam.py'}, changed
          PY
          export MINIO_TRIAL_ROOT="$RUNNER_TEMP/jm-minio-source-iam-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$MINIO_TRIAL_ROOT"
          mkdir -m 700 "$MINIO_TRIAL_ROOT/bin" "$MINIO_TRIAL_ROOT/tmp" "$MINIO_TRIAL_ROOT/build-evidence"
          printf 'MINIO_TRIAL_ROOT=%s\nTMPDIR=%s\nGOTMPDIR=%s\n' "$MINIO_TRIAL_ROOT" "$MINIO_TRIAL_ROOT/tmp" "$MINIO_TRIAL_ROOT/tmp" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false
      - uses: actions/checkout@v4
        with:
          repository: minio/minio
          ref: 827004cd6d3da8f49a5320c94ae74ae128156ed6
          path: _trial/minio
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: minio/mc
          ref: cc8758c88da31b95dde7b0b6997980ebfb8b98c4
          path: _trial/mc
          persist-credentials: false
      - name: Build immutable source inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _trial/minio rev-parse HEAD)" = "$MINIO_SOURCE"
          test "$(git -C _trial/mc rev-parse HEAD)" = "$MC_SOURCE"
          go version > "$MINIO_TRIAL_ROOT/build-evidence/identity.txt"
          printf 'candidate=%s\nworkflow=%s\nminio=%s\nmc=%s\n' "$CANDIDATE" "$GITHUB_SHA" "$MINIO_SOURCE" "$MC_SOURCE" >> "$MINIO_TRIAL_ROOT/build-evidence/identity.txt"
          for name in minio mc; do
            (
              cd "_trial/$name"
              sha256sum go.mod go.sum >> "$MINIO_TRIAL_ROOT/build-evidence/identity.txt"
              go build -mod=readonly -trimpath -buildvcs=true -o "$MINIO_TRIAL_ROOT/bin/$name" .
              test -z "$(git status --porcelain)"
            )
            go version -m "$MINIO_TRIAL_ROOT/bin/$name" > "$MINIO_TRIAL_ROOT/build-evidence/$name-build.txt"
            "$MINIO_TRIAL_ROOT/bin/$name" --version >> "$MINIO_TRIAL_ROOT/build-evidence/identity.txt"
            sha256sum "$MINIO_TRIAL_ROOT/bin/$name" >> "$MINIO_TRIAL_ROOT/build-evidence/identity.txt"
          done
      - name: Prepare known private Bash
        run: bash scripts/prepare-ci-bash.sh
      - name: Real provisioning, S3 permissions, key recovery and revocation
        run: python3 server/minio/qualify-real-iam.py
      - name: Upload bounded nonsecret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minio-source-real-iam-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/jm-minio-source-iam-${{ github.run_id }}-${{ github.run_attempt }}/build-evidence/*.txt
            ${{ runner.temp }}/jm-minio-source-iam-${{ github.run_id }}-${{ github.run_attempt }}/evidence/result.json
