name: Storage candidate ordinary compatibility

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Download the original immutable candidate
        uses: actions/download-artifact@v4
        with:
          name: storage-candidate-38209969671-1
          run-id: 38209969671
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/storage-candidate-import-38209969671-1
      - name: Verify retained image and run ordinary compatibility once
        id: qualify
        run: python3 -I -B server/minio/qualify-storage-candidate.py
      - name: Retain sanitized trial evidence and original image reference
        if: ${{ always() && steps.qualify.outputs.evidence_dir != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: storage-trial-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ steps.qualify.outputs.evidence_dir }}/result.json
            ${{ steps.qualify.outputs.evidence_dir }}/provenance.json
            ${{ steps.qualify.outputs.evidence_dir }}/candidate-image-reference.json
            ${{ steps.qualify.outputs.evidence_dir }}/compatibility-buildinfo.txt
            ${{ steps.qualify.outputs.evidence_dir }}/compatibility-result.json
            ${{ steps.qualify.outputs.evidence_dir }}/compatibility-status.txt
            ${{ steps.qualify.outputs.evidence_dir }}/artifact-manifest.json

