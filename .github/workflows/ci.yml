name: Native ARM64 storage candidate ordinary compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Build exact candidate and run ordinary compatibility once
        id: qualify
        run: python3 -I -B server/minio/qualify-storage-candidate.py
      - name: Retain only reviewed candidate and sanitized evidence
        if: ${{ always() && steps.qualify.outputs.evidence_ready == 'true' && steps.qualify.outputs.evidence_dir != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: storage-candidate-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ steps.qualify.outputs.evidence_dir }}/artifact-manifest.json
            ${{ steps.qualify.outputs.evidence_dir }}/candidate-Dockerfile
            ${{ steps.qualify.outputs.evidence_dir }}/candidate-image.json
            ${{ steps.qualify.outputs.evidence_dir }}/candidate-image.tar.gz
            ${{ steps.qualify.outputs.evidence_dir }}/compatibility-buildinfo.txt
            ${{ steps.qualify.outputs.evidence_dir }}/compatibility-result.json
            ${{ steps.qualify.outputs.evidence_dir }}/compatibility-status.txt
            ${{ steps.qualify.outputs.evidence_dir }}/mcli-binary-govulncheck.jsonl
            ${{ steps.qualify.outputs.evidence_dir }}/mcli-binary-govulncheck.stderr
            ${{ steps.qualify.outputs.evidence_dir }}/mcli-buildinfo.txt
            ${{ steps.qualify.outputs.evidence_dir }}/mcli-graph-summary.json
            ${{ steps.qualify.outputs.evidence_dir }}/mcli-module.patch
            ${{ steps.qualify.outputs.evidence_dir }}/mcli-modules.jsonl
            ${{ steps.qualify.outputs.evidence_dir }}/mcli-modules.stderr
            ${{ steps.qualify.outputs.evidence_dir }}/mcli-packages.jsonl
            ${{ steps.qualify.outputs.evidence_dir }}/mcli-packages.stderr
            ${{ steps.qualify.outputs.evidence_dir }}/mcli-source-govulncheck.jsonl
            ${{ steps.qualify.outputs.evidence_dir }}/mcli-source-govulncheck.stderr
            ${{ steps.qualify.outputs.evidence_dir }}/native-preflight.json
            ${{ steps.qualify.outputs.evidence_dir }}/provenance.json
            ${{ steps.qualify.outputs.evidence_dir }}/result.json
            ${{ steps.qualify.outputs.evidence_dir }}/scan-summary.json
            ${{ steps.qualify.outputs.evidence_dir }}/scanner-buildinfo.txt
            ${{ steps.qualify.outputs.evidence_dir }}/scanner-module.json
            ${{ steps.qualify.outputs.evidence_dir }}/scanner-provenance.json
            ${{ steps.qualify.outputs.evidence_dir }}/silo-binary-govulncheck.jsonl
            ${{ steps.qualify.outputs.evidence_dir }}/silo-binary-govulncheck.stderr
            ${{ steps.qualify.outputs.evidence_dir }}/silo-buildinfo.txt
            ${{ steps.qualify.outputs.evidence_dir }}/silo-graph-summary.json
            ${{ steps.qualify.outputs.evidence_dir }}/silo-module.patch
            ${{ steps.qualify.outputs.evidence_dir }}/silo-modules.jsonl
            ${{ steps.qualify.outputs.evidence_dir }}/silo-modules.stderr
            ${{ steps.qualify.outputs.evidence_dir }}/silo-packages.jsonl
            ${{ steps.qualify.outputs.evidence_dir }}/silo-packages.stderr
            ${{ steps.qualify.outputs.evidence_dir }}/silo-source-govulncheck.jsonl
            ${{ steps.qualify.outputs.evidence_dir }}/silo-source-govulncheck.stderr
