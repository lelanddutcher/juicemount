name: minio-anonymous-cloud-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minio-image:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      IMAGE: minio/minio:RELEASE.2025-01-20T14-49-07Z@sha256:ed9be66eb5f2636c18289c34c3b725ddf57815f2777c77b5938543b78a44f144
      CANDIDATE: 4dc11fed3533de754a2e04fce3307985774789d2
      DOCKER_CONFIG: ${{ runner.temp }}/minio-anon-docker-config
      AUDIT_DIR: ${{ runner.temp }}/minio-audit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4dc11fed3533de754a2e04fce3307985774789d2
          persist-credentials: false

      - name: Verify source, Compose pin, and anonymous Docker context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$DOCKER_CONFIG"
          mkdir -m 700 "$AUDIT_DIR"
          test -z "$(ls -A "$DOCKER_CONFIG")"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          {
            printf 'candidate=%s\n' "$CANDIDATE"
            printf 'checkout=%s\n' "$(git rev-parse HEAD)"
            printf 'workflow_sha=%s\n' "$GITHUB_SHA"
            printf 'workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF"
            printf 'workflow_run=%s attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            sha256sum server/docker-compose.yml
          } > "$AUDIT_DIR/metadata.txt"
          python3 - <<'PY' | tee -a "$AUDIT_DIR/metadata.txt"
          import pathlib, re
          compose = pathlib.Path('server/docker-compose.yml').read_text()
          refs = re.findall(r'^\s*image:\s*(minio/minio:\S+)\s*$', compose, re.M)
          expected = 'minio/minio:RELEASE.2025-01-20T14-49-07Z@sha256:ed9be66eb5f2636c18289c34c3b725ddf57815f2777c77b5938543b78a44f144'
          assert len(refs) == 3 and all(ref == expected for ref in refs), refs
          print('compose_minio_refs=3 identical pinned references')
          PY

      - name: Pull pinned amd64 image anonymously
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s docker pull --platform linux/amd64 "$IMAGE" 2>&1 | tee "$AUDIT_DIR/pull.log"
          repo_digests="$(docker image inspect --format '{{json .RepoDigests}}' "$IMAGE")"
          platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")"
          image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          [[ "$repo_digests" == *'minio/minio@sha256:ed9be66eb5f2636c18289c34c3b725ddf57815f2777c77b5938543b78a44f144'* ]]
          test "$platform" = linux/amd64
          {
            printf 'repo_digests=%s\n' "$repo_digests"
            printf 'platform=%s\n' "$platform"
            printf 'image_id=%s\n' "$image_id"
          } >> "$AUDIT_DIR/metadata.txt"

      - name: Check isolated runtime commands
        shell: bash
        run: |
          set -euo pipefail
          container_id=''
          cleanup() {
            rc=$?
            trap - EXIT
            if [[ -z "$container_id" ]]; then exit "$rc"; fi
            if [[ ! "$container_id" =~ ^[0-9a-f]{64}$ ]]; then
              echo 'refusing cleanup of invalid container ID' >&2
              exit 1
            fi
            if ! timeout 15s docker rm --force "$container_id" >/dev/null; then
              echo 'owned container removal failed' >&2
              exit 1
            fi
            remaining="$(timeout 10s docker ps -aq --no-trunc --filter "id=$container_id")" || {
              echo 'owned container absence check failed' >&2
              exit 1
            }
            if [[ -n "$remaining" ]]; then
              echo 'owned container still listed after removal' >&2
              exit 1
            fi
            echo 'owned_container_retired=true' >> "$AUDIT_DIR/metadata.txt"
            exit "$rc"
          }
          trap cleanup EXIT
          container_id="$(docker create \
            --name "minio-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges --user 65534:65534 \
            --entrypoint /bin/bash "$IMAGE" -c '
              set -e
              printf "bash=%s\n" "$BASH_VERSION"
              for tool in mc minio curl mkdir chmod mv rm date sleep tr head; do
                command -v "$tool" >/dev/null
                printf "tool=%s available\n" "$tool"
              done
              minio --version
              mc --version
              curl -q --version
            ')"
          [[ "$container_id" =~ ^[0-9a-f]{64}$ ]]
          printf 'container_id=%s\n' "$container_id" >> "$AUDIT_DIR/metadata.txt"
          timeout 30s docker start --attach "$container_id" 2>&1 | tee "$AUDIT_DIR/runtime.log"
          test "$(docker inspect --format '{{.State.Running}} {{.State.ExitCode}}' "$container_id")" = 'false 0'

      - name: Upload bounded nonsecret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minio-anonymous-cloud-check-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/minio-audit/metadata.txt
            ${{ runner.temp }}/minio-audit/pull.log
            ${{ runner.temp }}/minio-audit/runtime.log
