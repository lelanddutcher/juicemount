name: storage-image-real-iam

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-real-iam:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATE: 4dc11fed3533de754a2e04fce3307985774789d2
      STORAGE_TRIAL_IMAGE: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bind production patch and owned cloud workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$CANDIDATE"
          python3 - <<'PYTHON'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines())
          assert changed=={'.github/workflows/ci.yml','server/minio/qualify-image-iam.py','server/minio/provision-object-keys.sh','server/minio/objectkeys_test.go'},changed
          PYTHON
          trial_dir="$RUNNER_TEMP/jm-storage-iam-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$trial_dir"
          mkdir -m 700 "$trial_dir/tmp" "$trial_dir/evidence"
          printf 'MINIO_TRIAL_ROOT=%s\nTMPDIR=%s\nGOTMPDIR=%s\n' "$trial_dir" "$trial_dir/tmp" "$trial_dir/tmp" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare private Bash for existing keyd tests
        run: bash scripts/prepare-ci-bash.sh
      - name: Focused object-key tests
        shell: bash
        run: |
          set -euo pipefail
          go test -json -count=1 ./server/minio | tee "$MINIO_TRIAL_ROOT/evidence/unit.jsonl"
      - name: Image provisioning, credential transport, recovery and revocation
        run: python3 server/minio/qualify-image-iam.py
      - name: Upload bounded nonsecret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-image-real-iam-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/jm-storage-iam-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*.json
            ${{ runner.temp }}/jm-storage-iam-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*.jsonl
