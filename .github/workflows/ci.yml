name: storage-source-security-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Bind diagnostic patch to the qualified application source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 40208c76fd7175987f307b972cef156d785b4163
          python3 - <<'PYTHON'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines())
          assert changed == {'.github/workflows/ci.yml', 'server/minio/qualify-source-security.py'}, changed
          PYTHON
          python3 server/minio/qualify-source-security.py
      - name: Upload diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-source-security-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/jm-source-security-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*
