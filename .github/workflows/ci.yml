name: silo-upload-auth-regressions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Run pinned Silo upload-auth controls and three negative calibrations
        run: python3 server/minio/qualify-upload-auth.py
      - name: Upload bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silo-upload-auth-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/jm-silo-auth-${{ github.run_id }}-${{ github.run_attempt }}/evidence/result.json
            ${{ runner.temp }}/jm-silo-auth-${{ github.run_id }}-${{ github.run_attempt }}/evidence/hashes.json
            ${{ runner.temp }}/jm-silo-auth-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*.jsonl
            ${{ runner.temp }}/jm-silo-auth-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*.txt
            ${{ runner.temp }}/jm-silo-auth-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*.patch
